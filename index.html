const X={"headers": ["Región", "Regional / Centro de Formación ", "Eje Plan Estrégico SENA", "Línea de acción", "Reto Territorial Identificado \n(máximo 3 Sueños por dirección/centro)", "¿Existen antecedentes de esta iniciativa? Descríbalo", "Brecha u oportunidad identificada para el SENA en la región", "Sectores productivos estrategicos beneficiados en la regional", "Aliados estratégicos del territorio según cada eje con quienes el SENA debe articularse en la regional", "Hito anual 2027-2030", "Impacto esperado:\n1.beneficiarios\n2. presupuesto requerido\n3. impacto territorial"], "dreams": [["Valle del Cauca", "Regional Valle del Cauca – Despacho y 10 Centros de Formación", "Las Personas", "Formación a lo largo de la vida; bienestar integral; prevención NINI; empleabilidad.", "1. Valle del Cauca, territorio de oportunidades: consolidar MAIVALLE como modelo de atención integral que articule formación, empleo, emprendimiento y desarrollo comunitario en los 42 municipios.", "MAIVALLE propone pasar de una oferta estándar a una intervención basada en el territorio. Existen apuestas de cafés especiales, salvaguardia del paisaje cultural vichero y turismo biodiverso del Pacífico.\n\nAPORTES POR CENTRO Y DESPACHO:\nDespacho Regional: MAIVALLE: visitas, diagnóstico, formación pertinente, empleo, ocupación y emprendimiento; bienestar y permanencia del aprendiz; continuidad comunitaria y coherencia técnica entre administraciones.\nASTIN: TecnoAcademia, semilleros SIA y SEA, calidad formativa y vinculación APE. Acreditación de alta calidad y didáctica técnico-industrial.\nCBI: Bilingüismo técnico y formación en carga aérea, comercio exterior y cadena de frío.\nCGTS: Piloto de telesalud territorial, salud, turismo y gastronomía; acceso rural.\nCEAI: Formación en ocupaciones emergentes y vigilancia tecnológica.\nCNP: Saberes del Pacífico, turismo biodiverso, cocina tradicional y medicinal; salvaguardia vichera. Ruta gastronómica, saberes y sabores de mi tierra; articulación con comunidades y entidades territoriales.\nCDTI: Contenidos audiovisuales y culturales; formación en diseño y moda.\nCAB: Formación dual, convivencia, legalidad y articulación territorial MAIVALLE.\nCTA: Conexión territorial con empresas, alcaldías y productores; empleabilidad y relevo generacional cafetero.\nCC: Imparables Mujeres que transforman, vivienda rural sostenible y proyectos formativos en campo real.\nCLEM: Formación pertinente y asociatividad de productores de especies menores.", "Intervenciones fragmentadas, baja apropiación comunitaria y escasa continuidad entre diagnóstico y ejecución, identificadas en la presentación regional. Oportunidad de integrar rutas de atención y formación pertinente.", "Experiencias (turismo y gastronomía), macrosnacks, proteína blanca, agroindustria, excelencia clínica, comercio y servicios.", "Potenciales: Gobernación, alcaldías, instituciones educativas, organizaciones comunitarias, asociaciones de productores, empresas y academia. Articulación interna con APE, emprendimiento y los 10 centros.", "2027: validar rutas MAIVALLE, diagnósticos territoriales y oferta pertinente; estructurar pilotos de telesalud y formación dual.\n2028: ejecutar rutas de formación, TecnoAcademia, saberes del Pacífico, Imparables y relevo cafetero; registrar beneficiarios.\n2029: ampliar formación, certificación de competencias, intermediación APE y acompañamiento a emprendimientos.\n2030: consolidar resultados de municipios atendidos, aprendices certificados, permanencia en formación, colocaciones APE y unidades productivas acompañadas.", "Beneficiarios: jóvenes, adultos, comunidades rurales y étnicas, aprendices, buscadores de empleo y emprendedores. Cobertura objetivo: 42 municipios. Referencias PPT: proyecto viche, 800 familias y 35 maestros/sabedores (alcance Pacífico, no exclusivo del Valle), 700 participantes certificados previstos; CGTS, 2.800 beneficiarios directos iniciales, 150 mipymes y 600 personas rurales. \n Indicadores: municipios atendidos, aprendices certificados, permanencia en formación, colocaciones APE y unidades productivas acompañadas."], ["Valle del Cauca", "Regional Valle del Cauca – Despacho y 10 Centros de Formación", "Emprendimiento, Emprendedor y Empresario", "Alianzas con el sector empresarial; emprendimiento de alto impacto; ecosistema SENA. Complemento: internacionalización, bilingüismo y transferencia de conocimiento.", "2. Valle del Cauca, referente de innovación y productividad sostenible: consolidar una red intercentros de formación especializada, investigación aplicada, transferencia tecnológica y emprendimiento con proyección internacional.", "Apuestas 2027: ecosistema aerologístico de Palmira, simulador TH-67, industria 5.0, hidrógeno verde, fábrica de software, manufactura avanzada, bioprocesos y cafés especiales.\n\nAPORTES POR CENTRO Y DESPACHO:\nDespacho Regional: Articulación de portafolio intercentros y demanda territorial.\nASTIN: Escuela del Empaque Plástico, materiales y polímeros, SENNOVA, Tecnoparque, Fondo Emprender, OTRI/OPI. Informador Técnico, exploración I+D+i y explotación mediante formación y servicios; ideación y prototipado.\nCBI: Hub aerologístico Palmira: logística 4.0, WMS/TMS, IoT, gemelos digitales, bioprocesos y empaques bioexportables. Mantenimiento, analítica, instrumentación, redes industriales y ciberseguridad OT/IoT; huella de carbono.\nCGTS: Imagen óptica transdérmica, finanzas, administración, logística y TIC; alianza CDTI. Investigación aplicada, actualización curricular, innovación y alianzas empresariales; belleza y servicios personales.\nCEAI: Industria 5.0, IA, robótica colaborativa, ciberseguridad OT, fábrica de software, IoT y gemelos digitales. Smart Cities, agentes inteligentes para retos empresariales e institucionales, Mesa de Automatización y Plan Tecnológico 2026–2036.\nCNP: Cadenas pesqueras y acuícolas, construcción y conservación naval, logística portuaria.\nCDTI: Manufactura avanzada, CNC, prototipos, IA, software, agricultura inteligente, IoT, vestuario inteligente y simulador TH-67. Diseño digital, comercio electrónico, mecanizado CNC, producción gráfica y audiovisual.\nCAB: Convenio SENA-CIAT, productividad agroindustrial, prototipos y simuladores intercentros, SENA Empresa.\nCTA: Agricultura de precisión, calidad, trazabilidad, innovación aplicada, cafés especiales y emprendimiento. Soluciones a problemas reales del sector productivo y transformación agrotecnológica.\nCC: BIM, pavimento articulado prefabricado, tren de cercanías y producción de centros.\nCLEM: Producción pecuaria y acuícola inteligente, bioseguridad, trazabilidad, servicios tecnológicos, ERP/CRM y comercialización digital. Sanidad, bienestar animal, alimentación sostenible, validación de prototipos y asistencia técnica.", "Oportunidad de integrar capacidades tecnológicas de los centros con retos empresariales, ocupaciones emergentes, cadenas de valor y transferencia de soluciones. Brechas cuantitativas por validar.", "Economía digital, aeroespacial, bioenergía, macrosnacks, proteína blanca, sistema moda, belleza, excelencia clínica, hábitat y experiencias; logística 4.0 transversal.", "Potenciales: Aerocivil, Zona Franca del Pacífico, Manuelita, Mayagüez, Incauca, Providencia, CIAT, empresas, mesas sectoriales, academia y aliados internacionales.", "2027: estructurar portafolio intercentros; gestionar hitos CEAI (laboratorio de hidrógeno, tres ocupaciones emergentes, portafolio Mesa de Automatización y Plan Tecnológico 2026–2036).\n2028: desarrollar pilotos aerologísticos, agroindustriales, pesqueros, de manufactura, salud, moda y construcción.\n2029: ampliar servicios tecnológicos, transferencia, bilingüismo y cooperación; validar prototipos y acompañar emprendimientos.\n2030: consolidar registros de empresas atendidas, prototipos validados, soluciones transferidas, aprendices certificados y colocaciones APE.", "Beneficiarios: aprendices, instructores, empresas, productores y emprendedores. PPT: 210 aprendices del simulador TH-67; cafés especiales: 2.000 directos y 6.000 indirectos estimados en primera fase anual,  Indicadores: empresas atendidas, prototipos validados, soluciones transferidas, servicios tecnológicos prestados y emprendimientos acompañados."], ["Valle del Cauca", "Regional Valle del Cauca – Despacho y 10 Centros de Formación", "Infraestructura Física y Tecnológica", "Modernización de infraestructura física; arquitectura digital; equipamiento de punta; campus verdes y sostenibles. Complemento: gestión basada en datos.", "3. SENA Valle del futuro: infraestructura segura, inteligente y sostenible, y territorios resilientes. Articular los diez centros y el Despacho para modernizar los ambientes de formación y contribuir a la atención, reconstrucción segura y reactivación económica de los territorios afectados por el sismo del 10 de agosto de 2026.", "Recuperación de sedes tras el sismo del 10 de agosto, rehabilitación ambiental y energética de edificaciones y una apuesta intercentros de reconstrucción y reactivación económica.\n\nAPORTES POR CENTRO Y DESPACHO:\nDespacho Regional: Continuidad territorial, seguimiento a resultados y recuperación de sedes.\nASTIN: Innovación pedagógica y servicios tecnológicos; equipamiento compartido propuesto.\nCBI: Electromovilidad aeroportuaria, baterías, sistemas solares y logística verde.\nCGTS: Modernización integral de ambientes, adecuación, equipamiento, software y conectividad.\nCEAI: Laboratorio de hidrógeno, smart grids, renovables, almacenamiento y movilidad eléctrica.\nCNP: Conservación y restauración de sede e infraestructura local.\nCDTI: Eficiencia energética, monitoreo de agua y apoyo tecnológico a ambientes.\nCAB: Gestión digital sostenible y capacidades de prevención y respuesta ante riesgos. Formación en prevención y respuesta a riesgos con academia y entidades territoriales.\nCTA: IA y analítica para gestión, optimización de recursos, infraestructura y bienestar. Bienestar integral del talento humano y automatización administrativa.\nCC: Arquitectura e infraestructura, modernización de ambientes, I+D+i en edificaciones sostenibles y reconstrucción segura.\nCLEM: Gestión del agua, biorremediación, restauración ecológica, valorización de residuos y automatización BPM/RPA. Monitoreo ambiental, producción limpia, gestión documental y seguridad de la información.\n\nAPUESTA INTERCENTROS – atención, reconstrucción y reactivación económica de los territorios afectados por el sismo. Comprende apoyo técnico al mejoramiento de viviendas y soluciones habitacionales modulares y convencionales; formación de mano de obra local y articulación con procesos de reconstrucción; nuevos diseños y actualización curricular; fortalecimiento de unidades productivas y emprendimientos afectados; soluciones solares y rehabilitación ambiental y energética. Articulación con entidades territoriales y aliados, bajo MAIVALLE.", "Necesidad de recuperar y modernizar ambientes afectados, mejorar confort y eficiencia energética y asegurar continuidad de servicios. En los territorios afectados: necesidad de capacidades locales para reconstrucción segura, recuperación de viviendas y unidades productivas, y soluciones ambientales y energéticas. Oportunidad de integrar los diez centros mediante formación, asistencia técnica y transferencia tecnológica, dentro de las competencias del SENA.", "Hábitat urbano y rural, bioenergía, economía digital, construcción, manufactura y servicios tecnológicos.", "Potenciales: Gobernación, alcaldías, entidades de gestión del riesgo, universidades, empresas de construcción, energía y tecnología. Articulación con Dirección General y los 10 centros.", "2027: caracterizar necesidades de sedes y territorios afectados con aliados; priorizar estudios, diseños BIM, rutas de formación, actualización curricular y líneas base de consumo.\n2028: ejecutar intervenciones institucionales financiadas; desarrollar formación certificable para reconstrucción segura, prototipos habitacionales modulares y convencionales, pilotos solares y acompañamiento a unidades productivas afectadas.\n2029: ampliar asistencia técnica, formación, certificación de competencias, intermediación APE y acompañamiento a emprendimientos; escalar soluciones ambientales y energéticas y ambientes compartidos.\n2030: consolidar evidencias de ambientes intervenidos, personas formadas y certificadas, colocaciones APE, diseños y apoyos técnicos a viviendas, unidades productivas acompañadas, soluciones solares implementadas y consumos registrados. Metas sujetas a concertación y financiación.", "Beneficiarios: familias y comunidades afectadas por el sismo, aprendices, egresados, trabajadores de la construcción, emprendedores, unidades productivas, mujeres rurales y habitantes de municipios priorizados; instructores y administrativos de sedes intervenidas.\nPresupuesto: sujeto a estudios, diseños, competencias y programación plurianual.\nImpacto: continuidad de la formación, fortalecimiento de capacidades comunitarias, contribución a la reconstrucción segura y reactivación productiva, sostenibilidad ambiental y energética. Indicadores: ambientes intervenidos, personas formadas y certificadas, apoyos técnicos documentados, colocaciones APE, unidades productivas acompañadas y soluciones implementadas. No se compromete construcción directa de viviendas ni permanencia laboral."]], "centers": [["Despacho Regional", "MAIVALLE: visitas, diagnóstico, formación pertinente, empleo, ocupación y emprendimiento; bienestar y permanencia del aprendiz; continuidad comunitaria y coherencia técnica entre administraciones.", "Articulación de portafolio intercentros y demanda territorial.", "Continuidad territorial, seguimiento a resultados y recuperación de sedes.", "4–6, 20–21"], ["ASTIN", "TecnoAcademia, semilleros SIA y SEA, calidad formativa y vinculación APE. Acreditación de alta calidad y didáctica técnico-industrial.", "Escuela del Empaque Plástico, materiales y polímeros, SENNOVA, Tecnoparque, Fond function body(){if(s===0){if(t===0)return grid(D.map(d=>card(d[0],para(d[1])+para(d[2]))));if(t===1)return disclaimer+govTable()+card('Prioridades CTA',para('Oferta pertinente, innovación y especialización de centros. La especialización requiere articulación superior.'));if(t===2)return card('Seis ejes del Plan Estratégico SENA',para('Los seis nombres corresponden al desplegable del formulario Excel compartido. Las descripciones y correlaciones son orientaciones analíticas para el CTA.'))+grid(E.map((e,i)=>card((i+1)+'. '+e[0],para(e[1]))));return card('Visión compartida · hub articulador',`<div class="chain">${V.map(v=>`<span>${esc(v[0])}</span>`).join('')}</div>`+para('Pertinencia: política institucional, demanda social y requerimientos productivos.'))+V.map((v,i)=>vector(i)).join('')}

if(s===2){if(t===9)return apuesta(1);if(t===10)return apuesta(2);if(t>=6&&t<=8){let i=t-6;return card(dreamNames[i],para(cta[i+1])+matrix(i))+card('Oportunidad de fortalecimiento',para(suggestions[i]))+apuesta(i)}if(t===0)return metrics()+card('Presencia y relevancia',para('CTA aporta a 3 de 3 sueños y sus 5 vectores tienen correspondencia conceptual. No equivale a cobertura operativa.'))+contributions();if(t===1)return contributions();if(t===2)return V.map((v,i)=>vector(i)).join('');if(t===3)return table(['Centro','Aporte productivo registrado'],X.centers.filter(r=>r[0]!=='CTA').map(r=>[esc(r[0]),esc(r[2])]))+card('Complementariedad propuesta',para('CAB: transferencia agroindustrial; CEAI y CDTI: automatización y prototipos; CBI: logística; ASTIN: empaques. Alianzas no aprobadas.'));if(t===4)return card('Brechas de visibilidad operativa',table(['Dimensión','Pendiente'],[['Proyectos','Evidencias verificables'],['Hitos','Responsables y metas CTA'],['Impacto','Línea base y beneficiarios'],['Recursos','Presupuesto y aprobación'],['Aliados','Formalización']]));return card('Posicionamiento propuesto',para('CTA como articulador de la transformación agroindustrial y agrotecnológica del norte del Valle, integrando formación, investigación, innovación, emprendimiento y gestión sostenible.'))+contributions()}

1:{nombre:'Agroindustria 4.0',sub:'Especialización tecnológica y productiva',problema:'La identidad agroindustrial no se limita a la transformación física. Según el diagnóstico planteado, el CTA tiene limitaciones en ambientes especializados de transformación y capacidades emergentes en TIC, automatización, IA e IoT. Se propone complementar la infraestructura mediante alianzas y tecnologías habilitadoras, sin sustituir la práctica productiva. Como antecedente de esta apuesta, el CTA ha realizado desarrollos tecnológicos aplicados a procesos de la agroindustria del café, experiencia que constituye una base para fortalecer y ampliar la incorporación de tecnologías 4.0 en esta y otras cadenas productivas.',objetivo:'Desarrollar y validar soluciones digitales para modernizar las cadenas de valor agroindustriales del norte del Valle, mediante formación pertinente, investigación aplicada y transferencia tecnológica.',acciones:['Producción primaria: agricultura de precisión y monitoreo ambiental.','Poscosecha: sensores, clasificación y calidad.','Transformación: HMI, automatización y mantenimiento inteligente.','Almacenamiento y logística: cadena de frío, trazabilidad y seguimiento.','Comercialización: analítica e inteligencia empresarial.'],entregables:'Diagnóstico territorial, portafolio de prototipos, pilotos en ambientes productivos aliados, documentación y formación para transferencia.',indicadores:'Soluciones validadas, empresas y productores participantes, adopción tecnológica, cambios en calidad, productividad y consumo de recursos. Metas y presupuesto sujetos a línea base.',gob:'CTA: prototipado y formación dentro de sus competencias. Compartida: acceso a plantas, validación productiva, alianzas y transferencia. Instancias competentes: aprobación curricular e inversiones.',argumento:'El CTA no solamente forma para transformar productos agroindustriales; también forma para transformar tecnológicamente la agroindustria.'},
